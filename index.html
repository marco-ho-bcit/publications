  .order:hover { text-decoration: underline; }

  .summary { color: var(--muted); font-size: 13px; margin: 14px 0 0; }

  h2 { font: var(--h2-weight) var(--h2-size)/1.3 var(--heading-font); color: var(--h2-color); margin: 26px 0 2px; }
  h2 .span { font-weight: 400; color: var(--muted); }

  ol.pubs li {

scale low-dropout regulator with all minimum-channel-length transistors presented at the 2011 ieee student symposium on electron devices and solid-state circuits (s-edssc) hong kong dec. 15, 2011", "number": 1, "label": "P1"}]}</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("pub-data").textContent);
  var items = data.items;
  var STATUSES = [{ id: "published", label: "Published" }, { id: "accepted", label: "Accepted" }];

  var typeById = {}, areaById = {}, typeOrder = {}, areaOrder = {};
  data.types.forEach(function (t, i) { typeById[t.id] = t; typeOrder[t.id] = i; });
  data.areas.forEach(function (a, i) { areaById[a.id] = a; areaOrder[a.id] = i; });

  var state = {
    q: "",
    types: new Set(data.types.map(function (t) { return t.id; })),
    statuses: new Set(STATUSES.map(function (s) { return s.id; })),
    area: "all",
    group: "area",
    newestFirst: true
  };

  // ---- controls -----------------------------------------------------------
  function makeChips(containerId, options, set) {
    var box = document.getElementById(containerId);
    options.forEach(function (opt) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = opt.label;
      b.setAttribute("aria-pressed", "true");
      b.addEventListener("click", function () {
        if (set.has(opt.id)) set.delete(opt.id); else set.add(opt.id);
        b.setAttribute("aria-pressed", String(set.has(opt.id)));
        render();
      });
      box.appendChild(b);
    });
  }
  makeChips("types", data.types, state.types);
  makeChips("statuses", STATUSES, state.statuses);

  var areaSel = document.getElementById("area");
  areaSel.add(new Option("All areas", "all"));
  data.areas.forEach(function (a) { areaSel.add(new Option(a.name, a.id)); });
  areaSel.addEventListener("change", function () { state.area = areaSel.value; render(); });

  var groupSel = document.getElementById("groupby");
  groupSel.addEventListener("change", function () { state.group = groupSel.value; render(); });

  var orderBtn = document.getElementById("order");
  orderBtn.addEventListener("click", function () { state.newestFirst = !state.newestFirst; render(); });

  var q = document.getElementById("q");
  q.addEventListener("input", function () { state.q = q.value.trim().toLowerCase(); render(); });

  // ---- filtering and ordering --------------------------------------------
  function visible() {
    var words = state.q ? state.q.split(/\s+/) : [];
    return items.filter(function (it) {
      if (!state.types.has(it.type) || !state.statuses.has(it.status)) return false;
      if (state.area !== "all" && it.area !== state.area) return false;
      var hay = it.search + " " + (it.year || "") + " " + it.label.toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) !== -1; });
    });
  }

  // Newest first = highest number first (the CV order), with type as a tie-breaker.
  function compare(a, b) {
    var ya = a.year || 9999, yb = b.year || 9999;
    var r = (state.group === "year" || state.group === "none") ? (yb - ya) : 0;
    if (!r && a.type !== b.type) return typeOrder[a.type] - typeOrder[b.type];
    if (!r) r = b.number - a.number;
    return state.newestFirst ? r : -r;
  }

  // ---- rendering ----------------------------------------------------------
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function listHtml(list) {
    return '<ol class="pubs">' + list.map(function (it) {
      return '<li><span class="label">[' + esc(it.label) + ']</span><span class="cite">' + it.html + "</span></li>";
    }).join("") + "</ol>";
  }

  function byType(list) {
    return data.types.map(function (t) {
      var sub = list.filter(function (it) { return it.type === t.id; });
      return sub.length ? "<h3>" + esc(t.label) + " (" + sub.length + ")</h3>" + listHtml(sub) : "";
    }).join("");
  }

  function groups(list) {
    var map = new Map();
    list.forEach(function (it) {
      var k = state.group === "area" ? it.area : state.group === "type" ? it.type : (it.year || "Forthcoming");
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(it);
    });
    var keys = Array.from(map.keys());
    if (state.group === "area") keys.sort(function (a, b) { return areaOrder[a] - areaOrder[b]; });
    if (state.group === "type") keys.sort(function (a, b) { return typeOrder[a] - typeOrder[b]; });
    if (state.group === "year") keys.sort(function (a, b) {
      var r = (b === "Forthcoming" ? 9999 : b) - (a === "Forthcoming" ? 9999 : a);
      return state.newestFirst ? r : -r;
    });
    return keys.map(function (k) { return [k, map.get(k)]; });
  }

  function render() {
    var list = visible().sort(compare);
    orderBtn.textContent = state.newestFirst ? "Newest first" : "Oldest first";
    orderBtn.setAttribute("aria-label", "Order: " + orderBtn.textContent + ". Activate to reverse.");

    var summary = "Showing " + list.length + " of " + items.length + " publications";
    document.getElementById("summary").textContent = summary;

    var out = document.getElementById("list");
    if (!list.length) {
      out.innerHTML = '<p class="empty">No publications match these filters. <button type="button" id="reset">Clear filters</button></p>';
      document.getElementById("reset").addEventListener("click", reset);
      return;
    }
    if (state.group === "none") { out.innerHTML = listHtml(list); return; }

    out.innerHTML = groups(list).map(function (g) {
      var key = g[0], sub = g[1];
      if (state.group === "area") {
        var a = areaById[key];
        return '<h2>' + esc(a.name) + ' <span class="span">(' + esc(a.span) + ")</span></h2>" + byType(sub);
      }
      if (state.group === "type") return "<h2>" + esc(typeById[key].label) + " (" + sub.length + ")</h2>" + listHtml(sub);
      return "<h2>" + esc(key) + "</h2>" + byType(sub);
    }).join("");
  }

  function reset() {
    state.q = ""; q.value = "";
    data.types.forEach(function (t) { state.types.add(t.id); });
    STATUSES.forEach(function (s) { state.statuses.add(s.id); });
    state.area = "all"; areaSel.value = "all";
    document.querySelectorAll(".chip").forEach(function (b) { b.setAttribute("aria-pressed", "true"); });
    render();
  }

  document.getElementById("stamp").textContent = "Last updated " + data.generated + ".";
  render();
})();
</script>
